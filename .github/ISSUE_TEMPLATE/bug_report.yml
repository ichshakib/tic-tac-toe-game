name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Tic-Tac-Toe Royale
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us investigate and fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click on a cell in online mode...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions on how to reproduce the bug.
      placeholder: |
        1. Open index.html
        2. Select 'Online P2P' mode
        3. Host a room and join from second tab
        4. Make a move on cell 1
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The move should register and alternate turns smoothly.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Browser
      description: e.g., Chrome 120 on Windows 11, Safari on iOS 17
      placeholder: Chrome 120 / Windows 11
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any extra information, error logs from browser DevTools, or screenshots.
